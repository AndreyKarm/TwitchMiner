# Pushing a version tag (for example `git tag v0.2.0 && git push origin v0.2.0`)
# runs the tests, builds binaries for Windows, Linux and macOS, publishes them
# as a GitHub release, and pushes a multi-arch Docker image to GHCR.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - run: go vet ./...
      - run: go test ./...

  # The tray and icon code only builds on Windows, so test it there too.
  test-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: go test ./...

  build:
    needs: [test, test-windows]
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - { goos: windows, goarch: amd64 }
          - { goos: windows, goarch: arm64 }
          - { goos: linux, goarch: amd64 }
          - { goos: linux, goarch: arm64 }
          - { goos: darwin, goarch: amd64 }
          - { goos: darwin, goarch: arm64 }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: |
          name="twitchminer-${GITHUB_REF_NAME}-${GOOS}-${GOARCH}"
          ldflags="-s -w -X github.com/AndreyKarm/TwitchMiner/internal/config.Version=${GITHUB_REF_NAME}"
          mkdir -p "dist/$name"
          if [ "$GOOS" = windows ]; then
            # Embed the icon and version details, as build.bat does. The tools
            # run on this machine, so drop the Windows target for them.
            filever="${GITHUB_REF_NAME#v}"
            filever="${filever%%-*}"
            mkdir -p build
            env -u GOOS -u GOARCH go run ./tools/genicon build/twitchminer.ico
            env -u GOOS -u GOARCH go run github.com/tc-hib/go-winres@v0.3.3 simply \
              --arch "$GOARCH" --out cmd/twitchminer/rsrc --icon build/twitchminer.ico \
              --manifest gui --product-name TwitchMiner --file-description TwitchMiner \
              --original-filename twitchminer.exe \
              --product-version "$filever" --file-version "$filever"
            # The Windows build runs in the tray with no console window.
            go build -trimpath -ldflags "$ldflags -H=windowsgui" -o "dist/$name/twitchminer.exe" ./cmd/twitchminer
          else
            go build -trimpath -ldflags "$ldflags" -o "dist/$name/twitchminer" ./cmd/twitchminer
          fi
          cp README.md "dist/$name/"
          cd dist
          if [ "$GOOS" = windows ]; then
            zip -qr "$name.zip" "$name"
          else
            tar -czf "$name.tar.gz" "$name"
          fi
          rm -rf "$name"
      - uses: actions/upload-artifact@v4
        with:
          name: twitchminer-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/*

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        run: cd dist && sha256sum -- * > SHA256SUMS
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true

  docker:
    needs: [test, test-windows]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            # Pre-release tags such as v1.0.0-rc1 don't move "latest".
            type=raw,value=latest,enable=${{ !contains(github.ref_name, '-') }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: VERSION=${{ github.ref_name }}
